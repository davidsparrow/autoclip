# Serves the built AutoClip SPA and proxies the API to the backend container.
#
# Upstream's docker-compose.yml publishes port 3000 on the `autoclip` container,
# but nothing inside it ever listens there: the backend only runs uvicorn on
# 8000 and never mounts frontend/dist. This file is the missing half.

# Required so a WebSocket upgrade passes through cleanly. The /ws router is
# currently disabled upstream (backend/api/v1/__init__.py), but this costs
# nothing and means the proxy keeps working if it is re-enabled.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Source videos are large; nginx must not reject the upload itself.
    client_max_body_size 0;

    location /api/ {
        proxy_pass http://autoclip:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Clip pipelines run for minutes, and uploads stream in. Default 60s
        # timeouts and request buffering would both break that.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # The app uses HashRouter, so routes are /#/... and never hit the server as
    # real paths. try_files is belt-and-braces for a direct deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
